[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.0.1rc1"
description = "AI Coding CLI Workbench — a CLI-first, daemon-based system for controlling AI coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Forge Agent Team" }]
keywords = ["ai", "coding", "cli", "agent", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "websockets>=14",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6",
    "httpx>=0.28",
]

[project.scripts]
forge = "forge.main:main"

[project.urls]
Homepage = "https://github.com/forge-agent/forge-agent"
Repository = "https://github.com/forge-agent/forge-agent"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "frontend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["forge"]
omit = ["tests/*", "forge/web/*"]
